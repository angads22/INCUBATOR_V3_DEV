---
# rpi-image-gen layer definition for Incubator v3
# Validate with: rpi-image-gen metadata --lint layer/incubator/layer.yaml

name: incubator
description: |
  Incubator v3 application layer for Raspberry Pi Zero 2W.
  Installs the FastAPI incubator application by running its own install.sh
  (venv, systemd services, NetworkManager hotspot config, mDNS, OTA checkout).
author: Incubator Team

# ---------------------------------------------------------------------------
# APT packages installed into the image filesystem
# (install.sh installs the same set itself; listing them here lets bdebstrap
# fetch them in its package phase, which is faster and cache-friendly.)
# ---------------------------------------------------------------------------
packages:
  # Python runtime
  - python3
  - python3-pip
  - python3-venv
  - python3-dev

  # Version control (OTA updates check out release tags)
  - git

  # Network: NetworkManager owns Wi-Fi; dnsmasq-base serves DHCP/DNS for the
  # setup hotspot (NM shared mode); avahi makes <hostname>.local resolve.
  - curl
  - ca-certificates
  - network-manager
  - dnsmasq-base
  - avahi-daemon
  - rfkill
  - iw
  - wireless-regdb

  # GPIO / I2C hardware access (libgpiod character device, I2C sensors/RTC)
  - libgpiod-dev
  - python3-libgpiod
  - i2c-tools

  # Camera (picamera2 is a Raspberry Pi OS system package)
  - python3-picamera2

  # Math/image libs required by numpy / Pillow / tflite
  - libatlas-base-dev
  - libjpeg-dev
  - zlib1g-dev
  - libopenblas0

  # Build tools needed by pip for compiled wheels
  - gcc
  - build-essential

  # Utilities used by install.sh
  - rsync

# ---------------------------------------------------------------------------
# Layer variables
# Declare variables this layer consumes.  rpi-image-gen validates that each
# variable is defined before the build starts.
# ---------------------------------------------------------------------------
variables:
  INCUBATOR_APP_REPO:
    type: string
    description: Git remote URL for the incubator application
    default: https://github.com/angads22/INCUBATOR_V3_DEV.git
    optional: false

  INCUBATOR_APP_GIT_REF:
    type: string
    description: Git ref (tag / branch / SHA) to embed in the image
    default: main
    optional: false

  INCUBATOR_HOSTNAME:
    type: string
    description: Base hostname written to /etc/hostname
    default: incubator
    optional: true

  INCUBATOR_WIFI_COUNTRY:
    type: string
    description: Wi-Fi regulatory country (ISO 3166-1 alpha-2) baked into the image
    default: US
    optional: true

# ---------------------------------------------------------------------------
# Hook scripts executed during the bdebstrap build phases.
# Scripts run INSIDE the chroot after all packages have been installed.
# ---------------------------------------------------------------------------
hooks:
  # Main customisation phase (runs after pkg installation, inside chroot)
  customize:
    - hooks/10-install-incubator
