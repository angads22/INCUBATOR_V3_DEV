# Installed by install.sh as /etc/tmpfiles.d/incubator.conf.
# Runtime (tmpfs) directory for the control daemon's state/command files, the
# setup-mode state and the camera preview frames — recreated on every boot so
# nothing transient is ever written to the SD card.
d /run/incubator        0755 root root -
d /run/incubator/frames 0755 root root -
